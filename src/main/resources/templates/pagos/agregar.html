<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Pago - Venus Nails</title>
    <style>
        body { background-color: #f3f0f8; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #7b5ea7; }
        .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 12px rgba(123,94,167,0.15); max-width: 480px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #d1c4e9; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #7b5ea7; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
        button:hover { background: #5e2d91; }
        .back { color: #7b5ea7; }
        label { color: #555; font-size: 14px; }
    </style>
</head>
<body>
    <h1>💳 Registrar Pago</h1>
    <a class="back" th:href="@{/pagos/listar}">← Volver</a>
    <br><br>
    <div class="card">
        <form th:action="@{/pagos/agregar}" method="post" th:object="${pago}">
            <label>Cita</label>
            <!-- th:each llena el select con las citas de la BD -->
            <select th:field="*{idCita}">
                <option th:each="cita : ${citas}"
                        th:value="${cita.idCita}"
                        th:text="${'Cita #' + cita.idCita + ' - ' + cita.fecha}">
                </option>
            </select>
            <label>Fecha de pago</label>
            <input type="date" th:field="*{fecha}" required>
            <label>Metodo de pago</label>
            <select th:field="*{metodo}">
                <option value="Efectivo">Efectivo</option>
                <option value="Tarjeta">Tarjeta</option>
                <option value="Transferencia">Transferencia</option>
            </select>
            <button type="submit">Registrar Pago</button>
        </form>
    </div>
</body>
</html>
