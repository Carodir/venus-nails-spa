<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Manicurista - Venus Nails Spa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f0f8; }
        .header { background-color: #7b2d8b; color: white; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-morado { background-color: #7b2d8b; color: white; }
        .btn-morado:hover { background-color: #5a1f6b; color: white; }
        .badge-pendiente { background-color: #ffc107; color: black; }
        .badge-confirmada { background-color: #198754; }
        .badge-cancelada { background-color: #dc3545; }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Header -->
    <div class="header d-flex justify-content-between align-items-center">
        <div>
            <h2>🌸 Venus Nails Spa</h2>
            <p class="mb-0">Bienvenida, <strong th:text="${usuario.nombre}"></strong></p>
        </div>
        <a href="/logout" class="btn btn-light">Cerrar sesión</a>
    </div>

    <!-- Citas de hoy -->
    <div class="card p-4 mb-4">
        <h5 class="mb-3">📋 Citas de hoy</h5>
        <div th:if="${citasHoy.empty}" class="text-muted">No tienes citas programadas para hoy.</div>
        <table th:if="${!citasHoy.empty}" class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Cliente</th>
                    <th>Servicio</th>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citasHoy}">
                    <td th:text="${cita.usuario.nombre + ' ' + cita.usuario.apellido}"></td>
                    <td th:text="${cita.servicio.nombre}"></td>
                    <td th:text="${cita.horaInicio}"></td>
                    <td>
                        <span th:classappend="${cita.estado == 'Pendiente'} ? 'badge-pendiente' :
                                             (${cita.estado == 'Confirmada'} ? 'badge-confirmada' : 'badge-cancelada')"
                              class="badge"
                              th:text="${cita.estado}"></span>
                    </td>
                    <td>
                        <form th:if="${cita.estado == 'Pendiente'}"
                              th:action="@{/manicurista/confirmar/{id}(id=${cita.idCita})}"
                              method="post" style="display:inline">
                            <button type="submit" class="btn btn-success btn-sm">Confirmar</button>
                        </form>
                        <form th:if="${cita.estado != 'Cancelada'}"
                              th:action="@{/manicurista/cancelar/{id}(id=${cita.idCita})}"
                              method="post" style="display:inline">
                            <button type="submit" class="btn btn-danger btn-sm">Cancelar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Horarios -->
    <div class="card p-4">
        <h5 class="mb-3">🕐 Mis Horarios</h5>
        <div th:if="${horarios.empty}" class="text-muted">No tienes horarios registrados.</div>
        <table th:if="${!horarios.empty}" class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Día</th>
                    <th>Hora inicio</th>
                    <th>Hora fin</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="horario : ${horarios}">
                    <td th:text="${horario.diaSemana}"></td>
                    <td th:text="${horario.horaInicio}"></td>
                    <td th:text="${horario.horaFin}"></td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
