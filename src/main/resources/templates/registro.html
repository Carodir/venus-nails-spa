<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Venus Nails Spa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f3f0f8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(123,94,167,0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #7b5ea7; text-align: center; margin-bottom: 8px; font-size: 24px; }
        .subtitulo { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 24px; }
        label { display: block; color: #7b5ea7; font-weight: bold; margin-top: 16px; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1c4e9;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #7b5ea7; }
        button {
            width: 100%;
            padding: 12px;
            background: #7b5ea7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
        }
        button:hover { background: #6a4f96; }
        .error {
            background: #fdecea;
            color: #e53935;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .login-link a { color: #7b5ea7; text-decoration: none; font-weight: bold; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌸 Venus Nails Spa</h1>
        <p class="subtitulo">Crea tu cuenta gratis</p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/registro}" method="post" th:object="${usuario}">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" placeholder="Tu nombre" required>
            <label>Apellido</label>
            <input type="text" th:field="*{apellido}" placeholder="Tu apellido" required>
            <label>Correo electrónico</label>
            <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com" required>
            <label>Teléfono</label>
            <input type="text" th:field="*{telefono}" placeholder="Ej: 3001234567">
            <label>Contraseña</label>
            <input type="password" th:field="*{contrasena}" placeholder="Mínimo 6 caracteres" required>
            <button type="submit">Crear Cuenta</button>
        </form>
        <div class="login-link">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
