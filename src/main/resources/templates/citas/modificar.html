<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Cita - Venus Nails</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f3f0f8; font-family: Arial, sans-serif; min-height: 100vh; }
        header {
            background: #7b5ea7;
            color: white;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { color: #7b5ea7; margin-bottom: 24px; align-self: center; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 12px rgba(123,94,167,0.15);
            width: 100%;
            max-width: 500px;
        }
        label { display: block; color: #7b5ea7; font-weight: bold; margin-bottom: 6px; margin-top: 16px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1c4e9; border-radius: 8px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #7b5ea7; }
        input:disabled { background: #f3f0f8; color: #888; }
        .btn { background: #7b5ea7; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 24px; font-size: 16px; }
        .btn:hover { background: #6a4f96; }
        .back { color: #7b5ea7; text-decoration: none; display: inline-block; margin-top: 16px; }
    </style>
</head>
<body>
    <header>🌸 Venus Nails Spa</header>
    <main>
        <h1>✏️ Modificar Cita</h1>
        <div class="card">
            <form th:action="@{/citas/modificar/{id}(id=${cita.idCita})}" method="post">
                <label>Cliente</label>
                <input type="text" th:value="${cita.usuario.nombre + ' ' + cita.usuario.apellido}" disabled/>

                <label>Servicio</label>
                <select name="idServicio">
                    <option th:each="s : ${servicios}"
                            th:value="${s.idServicio}"
                            th:text="${s.nombre}"
                            th:selected="${s.idServicio == cita.servicio.idServicio}">
                    </option>
                </select>

                <label>Fecha</label>
                <input type="date" name="fecha" th:value="${cita.fecha}" required/>

                <label>Hora Inicio</label>
                <select name="horaInicio">
                    <option value="09:00" th:selected="${cita.horaInicio.toString() == '09:00'}">9:00 AM</option>
                    <option value="09:30" th:selected="${cita.horaInicio.toString() == '09:30'}">9:30 AM</option>
                    <option value="10:00" th:selected="${cita.horaInicio.toString() == '10:00'}">10:00 AM</option>
                    <option value="10:30" th:selected="${cita.horaInicio.toString() == '10:30'}">10:30 AM</option>
                    <option value="11:00" th:selected="${cita.horaInicio.toString() == '11:00'}">11:00 AM</option>
                    <option value="11:30" th:selected="${cita.horaInicio.toString() == '11:30'}">11:30 AM</option>
                    <option value="12:00" th:selected="${cita.horaInicio.toString() == '12:00'}">12:00 PM</option>
                    <option value="12:30" th:selected="${cita.horaInicio.toString() == '12:30'}">12:30 PM</option>
                    <option value="13:00" th:selected="${cita.horaInicio.toString() == '13:00'}">1:00 PM</option>
                    <option value="13:30" th:selected="${cita.horaInicio.toString() == '13:30'}">1:30 PM</option>
                    <option value="14:00" th:selected="${cita.horaInicio.toString() == '14:00'}">2:00 PM</option>
                    <option value="14:30" th:selected="${cita.horaInicio.toString() == '14:30'}">2:30 PM</option>
                    <option value="15:00" th:selected="${cita.horaInicio.toString() == '15:00'}">3:00 PM</option>
                    <option value="15:30" th:selected="${cita.horaInicio.toString() == '15:30'}">3:30 PM</option>
                    <option value="16:00" th:selected="${cita.horaInicio.toString() == '16:00'}">4:00 PM</option>
                    <option value="16:30" th:selected="${cita.horaInicio.toString() == '16:30'}">4:30 PM</option>
                    <option value="17:00" th:selected="${cita.horaInicio.toString() == '17:00'}">5:00 PM</option>
                    <option value="17:30" th:selected="${cita.horaInicio.toString() == '17:30'}">5:30 PM</option>
                    <option value="18:00" th:selected="${cita.horaInicio.toString() == '18:00'}">6:00 PM</option>
                    <option value="18:30" th:selected="${cita.horaInicio.toString() == '18:30'}">6:30 PM</option>
                    <option value="19:00" th:selected="${cita.horaInicio.toString() == '19:00'}">7:00 PM</option>
                </select>

                <button class="btn" type="submit">Guardar Cambios</button>
            </form>
            <a class="back" th:href="@{/citas/listar}">← Volver a Citas</a>
        </div>
    </main>
</body>
</html>
