<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Usuario - Venus Nails</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f3f0f8; font-family: Arial, sans-serif; min-height: 100vh; }
        header { background: #7b5ea7; color: white; padding: 16px 40px; font-size: 20px; font-weight: bold; }
        main { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        h1 { color: #7b5ea7; margin-bottom: 24px; }
        .card { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 4px 12px rgba(123,94,167,0.15); width: 100%; max-width: 480px; }
        label { display: block; color: #7b5ea7; font-weight: bold; margin-top: 16px; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1c4e9; border-radius: 8px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #7b5ea7; }
        button { width: 100%; padding: 12px; background: #7b5ea7; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 24px; }
        button:hover { background: #6a4f96; }
        .back { color: #7b5ea7; text-decoration: none; display: inline-block; margin-top: 16px; }
    </style>
</head>
<body>
    <header>🌸 Venus Nails Spa</header>
    <main>
        <h1>✏️ Modificar Usuario</h1>
        <div class="card">
            <form th:action="@{/usuarios/modificar/{id}(id=${usuario.idUsuario})}" method="post" th:object="${usuario}">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" required>
                <label>Apellido</label>
                <input type="text" th:field="*{apellido}" required>
                <label>Correo electrónico</label>
                <input type="email" th:field="*{correo}" required>
                <label>Teléfono</label>
                <input type="text" th:field="*{telefono}">
                <label>Contraseña</label>
                <input type="password" th:field="*{contrasena}" required>
                <label>Rol</label>
                <select th:field="*{rol}">
                    <option value="cliente">Cliente</option>
                    <option value="manicurista">Manicurista</option>
                    <option value="admin">Administrador</option>
                </select>
                <button type="submit">Guardar Cambios</button>
            </form>
            <a class="back" th:href="@{/usuarios/listar}">← Volver a Usuarios</a>
        </div>
    </main>
</body>
</html>
