<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario - Venus Nails</title>
    <style>
        body { background-color: #f3f0f8; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #7b5ea7; }
        .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 12px rgba(123,94,167,0.15); max-width: 480px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #d1c4e9; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #7b5ea7; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
        button:hover { background: #5e2d91; }
        .error { color: red; margin-bottom: 12px; }
        .back { color: #7b5ea7; }
    </style>
</head>
<body>
    <h1>➕ Registrar Usuario</h1>
    <a class="back" th:href="@{/usuarios/listar}">← Volver</a>
    <br><br>
    <div class="card">
        <!-- Mostrar error si el correo ya existe -->
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/usuarios/registrar}" method="post" th:object="${usuario}">
            <input type="text" th:field="*{nombre}" placeholder="Nombre" required>
            <input type="text" th:field="*{apellido}" placeholder="Apellido" required>
            <input type="email" th:field="*{correo}" placeholder="Correo electronico" required>
            <input type="text" th:field="*{telefono}" placeholder="Telefono">
            <input type="password" th:field="*{contrasena}" placeholder="Contrasena" required>
            <select th:field="*{rol}">
                <option value="cliente">Cliente</option>
                <option value="manicurista">Manicurista</option>
                <option value="admin">Administrador</option>
            </select>
            <button type="submit">Registrar</button>
        </form>
    </div>
</body>
</html>
