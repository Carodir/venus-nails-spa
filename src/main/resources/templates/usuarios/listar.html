<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Venus Nails</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f3f0f8; font-family: Arial, sans-serif; min-height: 100vh; }
        header { background: #7b5ea7; color: white; padding: 16px 40px; font-size: 20px; font-weight: bold; }
        main { padding: 40px; }
        h1 { color: #7b5ea7; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px rgba(123,94,167,0.15); }
        th { background: #7b5ea7; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #f3f0f8; }
        tr:hover { background: #f3f0f8; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .btn { background: #7b5ea7; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; display: inline-block; }
        .btn-edit { background: #fb8c00; color: white; padding: 6px 12px; border-radius: 8px; text-decoration: none; display: inline-block; }
        .btn-delete { background: #e53935; color: white; padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; }
        .back { color: #7b5ea7; text-decoration: none; display: inline-block; margin-top: 20px; }
        .rol-admin { color: #7b5ea7; font-weight: bold; }
        .rol-manicurista { color: #fb8c00; font-weight: bold; }
        .rol-cliente { color: #43a047; font-weight: bold; }
        .error { background: #fdecea; color: #e53935; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <header>🌸 Venus Nails Spa</header>
    <main>
        <h1>👥 Lista de Usuarios</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <div class="top-bar">
            <a class="btn" th:href="@{/usuarios/registrar}">+ Nuevo Usuario</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.idUsuario}"></td>
                    <td th:text="${usuario.nombre}"></td>
                    <td th:text="${usuario.apellido}"></td>
                    <td th:text="${usuario.correo}"></td>
                    <td th:text="${usuario.telefono}"></td>
                    <td>
                        <span th:classappend="${usuario.rol == 'admin'} ? 'rol-admin' : (${usuario.rol == 'manicurista'} ? 'rol-manicurista' : 'rol-cliente')"
                              th:text="${usuario.rol}"></span>
                    </td>
                    <td>
                        <a class="btn-edit" th:href="@{/usuarios/modificar/{id}(id=${usuario.idUsuario})}">Modificar</a>
                        <form style="display:inline"
                              th:action="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                              method="post">
                            <button class="btn-delete" type="submit"
                                    onclick="return confirm('¿Segura que deseas eliminar este usuario?')">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <a class="back" th:href="@{/admin/panel}">← Volver al Panel</a>
    </main>
</body>
</html>
