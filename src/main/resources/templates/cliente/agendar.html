<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Venus Nails Spa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f0f5; }
        .header { background-color: #7b2d8b; color: white; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-morado { background-color: #7b2d8b; color: white; }
        .btn-morado:hover { background-color: #5a1f6b; color: white; }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Header -->
    <div class="header d-flex justify-content-between align-items-center">
        <div>
            <h2>💅 Venus Nails Spa</h2>
            <p class="mb-0">Agendar nueva cita</p>
        </div>
        <a href="/cliente/panel" class="btn btn-light">← Volver al panel</a>
    </div>

    <!-- Formulario -->
    <div class="card p-4">
        <h5 class="mb-4">📅 Nueva Cita</h5>
        <form action="/cliente/agendar" method="post">

            <div class="mb-3">
                <label class="form-label">Servicio</label>
                <select name="idServicio" class="form-select" required>
                    <option value="">-- Selecciona un servicio --</option>
                    <option th:each="servicio : ${servicios}"
                            th:value="${servicio.idServicio}"
                            th:text="${servicio.nombre} + ' - $' + ${servicio.precio}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" name="fecha" class="form-control" required
                       th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
            </div>

            <div class="mb-3">
                <label class="form-label">Hora</label>
                <select name="horaInicio" class="form-select" required>
                    <option value="">-- Selecciona una hora --</option>
                    <option th:each="hora : ${horas}"
                            th:value="${hora}"
                            th:text="${hora}">
                    </option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-morado">Agendar Cita</button>
                <a href="/cliente/panel" class="btn btn-outline-secondary">Cancelar</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
