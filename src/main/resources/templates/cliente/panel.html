<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Panel - Venus Nails Spa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f0f5; }
        .header { background-color: #7b2d8b; color: white; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-morado { background-color: #7b2d8b; color: white; }
        .btn-morado:hover { background-color: #5a1f6b; color: white; }
        .badge-pendiente { background-color: #ffc107; color: black; }
        .badge-confirmada { background-color: #198754; }
        .badge-cancelada { background-color: #dc3545; }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Header -->
    <div class="header d-flex justify-content-between align-items-center">
        <div>
            <h2>💅 Venus Nails Spa</h2>
            <p class="mb-0">Bienvenida, <strong th:text="${usuario.nombre}"></strong></p>
        </div>
        <a href="/logout" class="btn btn-light">Cerrar sesión</a>
    </div>

    <!-- Botones acceso rápido -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="card p-4 text-center">
                <h5>📅 Mis Citas</h5>
                <p class="text-muted">Agenda o consulta tus citas</p>
                <a href="/cliente/agendar" class="btn btn-morado">Nueva Cita</a>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card p-4 text-center">
                <h5>⭐ Mis Reseñas</h5>
                <p class="text-muted">Comparte tu experiencia</p>
                <a href="/cliente/resenas" class="btn btn-morado">Ver Reseñas</a>
            </div>
        </div>
    </div>

    <!-- Tabla de citas -->
    <div class="card p-4">
        <h5 class="mb-3">📋 Mis Citas</h5>
        <div th:if="${citas.empty}" class="text-muted">No tienes citas registradas aún.</div>
        <table th:if="${!citas.empty}" class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Servicio</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citas}">
                    <td th:text="${cita.servicio.nombre}"></td>
                    <td th:text="${cita.fecha}"></td>
                    <td th:text="${cita.horaInicio}"></td>
                    <td>
                        <span th:classappend="${cita.estado == 'Pendiente'} ? 'badge-pendiente' :
                                             (${cita.estado == 'Confirmada'} ? 'badge-confirmada' : 'badge-cancelada')"
                              class="badge"
                              th:text="${cita.estado}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
