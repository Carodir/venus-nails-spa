<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios - Venus Nails</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f3f0f8; font-family: Arial, sans-serif; min-height: 100vh; }
        header { background: #7b5ea7; color: white; padding: 16px 40px; font-size: 20px; font-weight: bold; }
        main { padding: 40px; }
        h1 { color: #7b5ea7; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px rgba(123,94,167,0.15); }
        th { background: #7b5ea7; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #f3f0f8; }
        tr:hover { background: #f3f0f8; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .btn { background: #7b5ea7; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; display: inline-block; }
        .btn-edit { background: #fb8c00; color: white; padding: 6px 12px; border-radius: 8px; text-decoration: none; display: inline-block; }
        .btn-delete { background: #e53935; color: white; padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; }
        .back { color: #7b5ea7; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <header>🌸 Venus Nails Spa</header>
    <main>
        <h1>💅 Servicios</h1>
        <div class="top-bar">
            <a class="btn" th:href="@{/servicios/agregar}">+ Nuevo Servicio</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Duración (min)</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="servicio : ${servicios}">
                    <td th:text="${servicio.idServicio}"></td>
                    <td th:text="${servicio.nombre}"></td>
                    <td th:text="${servicio.descripcion}"></td>
                    <td th:text="${servicio.duracion}"></td>
                    <td th:text="'$' + ${servicio.precio}"></td>
                    <td>
                        <a class="btn-edit" th:href="@{/servicios/modificar/{id}(id=${servicio.idServicio})}">Modificar</a>
                        <form style="display:inline"
                              th:action="@{/servicios/eliminar/{id}(id=${servicio.idServicio})}"
                              method="post">
                            <button class="btn-delete" type="submit"
                                    onclick="return confirm('¿Segura que deseas eliminar este servicio?')">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <a class="back" th:href="@{/admin/panel}">← Volver al Panel</a>
    </main>
</body>
</html>
