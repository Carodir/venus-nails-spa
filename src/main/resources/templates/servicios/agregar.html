<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Servicio - Venus Nails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f0f8; }
        .header { background-color: #7b2d8b; color: white; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-morado { background-color: #7b2d8b; color: white; }
        .btn-morado:hover { background-color: #5a1f6b; color: white; }
    </style>
</head>
<body>
<div class="container mt-4">

    <div class="header d-flex justify-content-between align-items-center">
        <div>
            <h2>💅 Venus Nails Spa</h2>
            <p class="mb-0">Agregar nuevo servicio</p>
        </div>
        <a href="/servicios/listar" class="btn btn-light">← Volver</a>
    </div>

    <div class="card p-4">
        <h5 class="mb-4">💅 Nuevo Servicio</h5>
        <form action="/servicios/agregar" method="post">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Duración (minutos)</label>
                <input type="number" name="duracion" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="number" name="precio" step="0.01" class="form-control" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-morado">Guardar</button>
                <a href="/servicios/listar" class="btn btn-outline-secondary">Cancelar</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
